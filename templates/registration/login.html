{% extends "booking/base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; margin-top: 40px;">
    <div style="
        background-color: #ffffff;
        padding: 28px 32px;
        border-radius: 10px;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
        width: 360px;
    ">
        <h2>Sign In</h2>

        {% if form.errors %}
            <p style="
                margin-bottom: 16px;
                padding: 10px 12px;
                border-radius: 6px;
                background-color: #fdecea;
                color: #c62828;
                font-size: 14px;
            ">
                Please double-check your username and password and try again.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom: 16px;">
                <label for="{{ form.username.id_for_label }}" style="display:block; font-weight:600; margin-bottom:4px;">
                    Username:
                </label>
                {{ form.username }}
            </div>

            <div style="margin-bottom: 16px;">
                <label for="{{ form.password.id_for_label }}" style="display:block; font-weight:600; margin-bottom:4px;">
                    Password:
                </label>
                {{ form.password }}
            </div>

            <button type="submit">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
